<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.C.Name}} logs · {{.Hostname}}</title>
{{template "head"}}
</head>
<body class="logs-page">
<header class="topbar">
  <div class="topbar-inner">
    {{template "brand"}}
    <div class="host"><span class="host-label">Host</span><span class="hostname">{{.Hostname}}</span></div>
    <div class="chips"><span class="chip">logs</span></div>
    {{template "back"}}
  </div>
</header>
<main class="page">
  <div class="card log-card">
    <div class="card-head">
      <span class="state-{{.C.State}} cname"><span class="dot" aria-hidden="true"></span><h2 class="container-name">{{.C.Name}}</h2></span>
      <span class="badges"><span class="state-{{.C.State}}"><span class="state">{{.C.State}}</span></span></span>
      <span class="muted">last {{.Tail}} lines{{if eq .C.State "running"}}, then live{{end}}</span>
      <span class="card-head-end">
        <span class="log-status muted"></span>
        <button type="button" class="btn btn-secondary btn-sm log-pause" aria-pressed="false">Pause</button>
      </span>
    </div>
    <pre class="terminal log" data-stream="/containers/{{.C.ID}}/logs/stream" aria-live="off"></pre>
  </div>
  <noscript><div class="callout callout-bad error">The log view needs JavaScript.</div></noscript>
</main>
<script src="/static/app.js"></script>
</body>
</html>
