<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.C.Name}} logs · {{.Hostname}}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="logs-page">
<header>
  <h1><a href="/">scd</a></h1>
  <span class="meta">host: <b class="hostname">{{.Hostname}}</b></span>
  <span class="meta">logs: <b class="container-name">{{.C.Name}}</b> <span class="state-{{.C.State}}"><span class="state">{{.C.State}}</span></span></span>
  <span class="actions">
    <button type="button" class="log-pause" aria-pressed="false">Pause</button>
  </span>
</header>
<main>
  <p><a href="/">← back to the dashboard</a> · last {{.Tail}} lines{{if eq .C.State "running"}}, then live{{end}} <span class="log-status meta"></span></p>
  <pre class="log" data-stream="/containers/{{.C.ID}}/logs/stream" aria-live="off"></pre>
  <noscript><p class="error">The log view needs JavaScript.</p></noscript>
</main>
<script src="/static/app.js"></script>
</body>
</html>
