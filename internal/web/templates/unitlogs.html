<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Unit}} log · {{.Hostname}}</title>
{{template "head"}}
</head>
<body class="logs-page">
<header class="topbar">
  <div class="topbar-inner">
    {{template "brand"}}
    <div class="host"><span class="host-label">Host</span><span class="hostname">{{.Hostname}}</span></div>
    <div class="chips"><span class="chip">unit log</span></div>
    {{template "back"}}
  </div>
</header>
<main class="page">
  <div class="card log-card">
    <div class="card-head">
      <h1 class="unit-name mono">{{.Unit}}</h1>
      <span class="muted">last {{.Tail}} journal lines, then live</span>
      <span class="card-head-end">
        <span class="live" hidden><span class="live-dot" aria-hidden="true"></span>Live</span>
        <span class="log-status muted" role="status"></span>
        <button type="button" class="btn btn-secondary btn-sm log-pause" aria-pressed="false">Pause</button>
      </span>
    </div>
    <pre class="terminal log" data-stream="/units/{{.Unit}}/logs/stream" aria-live="off"></pre>
  </div>
  <noscript><div class="callout callout-bad error">The log view needs JavaScript.</div></noscript>
</main>
<script src="/static/app.js"></script>
</body>
</html>
