<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Unit}} log · {{.Hostname}}</title>
{{template "head"}}
</head>
<body class="logs-page">
{{template "shell-start" (dict "Hostname" .Hostname "Page" "logs" "Parent" "Unit logs" "Crumb" .Unit)}}
  <div class="card log-card">
    <div class="card-head">
      <h1 class="unit-name mono">{{.Unit}}</h1>
      <span class="card-head-end">
        <span class="live" hidden><span class="live-dot" aria-hidden="true"></span>Live</span>
        <span class="log-status muted" role="status"></span>
        <button type="button" class="btn btn-secondary btn-sm log-pause" aria-pressed="false">Pause</button>
      </span>
    </div>
    <div class="log-toolbar" role="toolbar" aria-label="Log view">
      <label class="field field-grow"><span class="visually-hidden">Filter lines</span>
        <input type="search" class="log-filter" placeholder="Filter lines…" autocomplete="off" spellcheck="false"></label>
      <span class="log-count muted" aria-live="polite"></span>
      <label class="field"><span>Lines</span>
        <select class="log-lines">{{range .Tails}}<option value="{{.}}"{{if eq . $.Tail}} selected{{end}}>{{.}}</option>{{end}}</select></label>
      
      <button type="button" class="btn btn-secondary btn-sm log-download">Download</button>
    </div>
    <p class="log-hint muted">Last <span class="log-tail">{{.Tail}}</span> journal lines, then live.</p>
    <pre class="terminal log" data-stream="/units/{{.Unit}}/logs/stream" data-name="{{.Unit}}" aria-live="off"></pre>
  </div>
  <noscript><div class="callout callout-bad error">The log view needs JavaScript.</div></noscript>
{{template "shell-end"}}
</body>
</html>
